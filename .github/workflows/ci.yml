name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "pisama-core @ git+https://github.com/Pisama-AI/pisama-core.git@v1.8.0"
      - run: python -m pip install -e ".[dev,mcp]"
      - run: ruff check src tests
      - run: mypy src/pisama

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install "pisama-core @ git+https://github.com/Pisama-AI/pisama-core.git@v1.8.0"
      - run: python -m pip install -e ".[dev,mcp]"
      - run: pytest -q

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Test wheel in a clean environment
        run: |
          python -m venv /tmp/pisama-wheel-smoke
          /tmp/pisama-wheel-smoke/bin/python -m pip install "pisama-core @ git+https://github.com/Pisama-AI/pisama-core.git@v1.8.0"
          /tmp/pisama-wheel-smoke/bin/python -m pip install "dist/pisama-"*.whl
          /tmp/pisama-wheel-smoke/bin/pisama --help
          /tmp/pisama-wheel-smoke/bin/python -c "import pisama; assert pisama.__version__"
